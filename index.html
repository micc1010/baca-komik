<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KomikIndo Web - Pembaca Vertikal Ringan</title>
    <style>
        :root {
            --primary: #ff5722; 
            --bg-dark: #0f1016;
            --card-bg: #1a1c29;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }

        header {
            background-color: rgba(15, 16, 22, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky; top: 0; z-index: 1000;
        }

        header h1 { color: var(--primary); font-size: 24px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }

        .search-container { position: relative; width: 300px; }
        .search-container input {
            width: 100%; padding: 10px 15px; background: #222533;
            border: 1px solid #33384f; border-radius: 20px; color: white; outline: none;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .ad-space {
            width: 100%; min-height: 90px; background: #222; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
            color: #555; border-radius: 8px; border: 1px dashed #444; overflow: hidden;
        }

        .comic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .comic-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .comic-card:hover { transform: scale(1.05); }
        .comic-poster { width: 100%; height: 260px; object-fit: cover; }
        .comic-info { padding: 12px; }

        .page-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; z-index: 2000; padding: 20px; overflow-y: auto; }
        .page-content { max-width: 800px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; }

        .btn-back { background: #333; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .btn-back:hover { background: #555; }

        .episode-list { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .episode-item { background: #222533; padding: 12px; border-radius: 6px; cursor: pointer; text-align: center; transition: 0.3s; font-size: 14px; }
        .episode-item:hover { background: var(--primary); }

        .reader-container { max-width: 700px; margin: 0 auto; text-align: center; }
        .comic-image-wrapper { width: 100%; background: #000; }
        
        .comic-page-img { width: 100%; height: auto; display: block; margin: 0 auto; background: #000; }

        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 15px 20px; max-width: 700px; margin: 0 auto; }
        .btn-nav { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; color: #fff; text-align: center; transition: 0.2s; }
        .btn-prev { background: #33384f; }
        .btn-prev:hover { background: #444a69; }
        .btn-next { background: var(--primary); }
        .btn-next:hover { background: #e64a19; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="aksiDenganIklan(() => goHome())">KomikIndo Web</h1>
        <div class="search-container">
            <input type="text" id="searchInput" onkeyup="searchComic()" placeholder="Cari komik...">
        </div>
    </header>

    <div class="container" id="mainMenu">
        <div class="ad-space">
            <script type="text/javascript">
                atOptions = {
                    'key' : '223bb73deddb6f2aeb053d91b5a64e28',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/223bb73deddb6f2aeb053d91b5a64e28/invoke.js"></script>
        </div>
        
        <h2 style="margin-bottom: 20px;">Update Manga Terbaru</h2>
        <div class="comic-grid" id="comicList"></div>
    </div>

    <div id="detailPage" class="page-overlay">
        <div class="page-content">
            <button class="btn-back" onclick="aksiDenganIklan(() => history.back())">← Kembali ke Utama</button>
            <h2 id="detailTitle" style="color: var(--primary); margin-bottom: 10px;">Judul Komik</h2>
            <p id="detailDesc" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.6;"></p>
            <h3>Pilih Chapter:</h3>
            <div class="episode-list" id="episodeListArea"></div>
        </div>
    </div>

    <div id="readerPage" class="page-overlay" style="background: #000; padding: 0;">
        <div style="padding: 20px 20px 0 20px; max-width: 700px; margin: 0 auto;">
            <button class="btn-back" onclick="aksiDenganIklan(() => history.back())">← Daftar Chapter</button>
        </div>

        <div class="nav-wrapper" id="topNavArea"></div>

        <div class="reader-container">
            <div class="comic-image-wrapper" id="comicViewerArea"></div>
        </div>

        <div class="nav-wrapper" id="bottomNavArea" style="margin-top: 20px; padding-bottom: 40px;"></div>
    </div>

    <script src="list-komik.js"></script>
    <script src="opm-data.js"></script>
    <script src="sololeveling-data.js"></script>
    <script src="eleceed-data.js"></script>

    <script>
        const URL_DIRECT_LINK = "https://www.effectivecpmnetwork.com/pn5sfcnibb?key=1f3d67adb73628195167dc75539db295"; 

        function aksiDenganIklan(callbackAksi) {
            window.open(URL_DIRECT_LINK, '_blank');
            if (callbackAksi) callbackAksi();
        }

        function displayComics(data) {
            const list = document.getElementById('comicList');
            list.innerHTML = data.map(c => {
                let totalChapterOtomatis = 0;
                if (c.id === "one-punch-man" && typeof chapters_opm !== 'undefined') {
                    totalChapterOtomatis = chapters_opm.length;
                } else if (c.id === "solo-leveling" && typeof chapters_sololeveling !== 'undefined') {
                    totalChapterOtomatis = chapters_sololeveling.length;
                } else if (c.id === "eleceed" && typeof chapters_eleceed !== 'undefined') {
                    totalChapterOtomatis = chapters_eleceed.length;
                }

                return `
                    <div class="comic-card" onclick="aksiDenganIklan(() => openDetail('${c.id}'))">
                        <img src="${c.poster}" class="comic-poster">
                        <div class="comic-info">
                            <div style="font-weight:bold; font-size:14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${c.title}</div>
                            <div style="font-size:12px; color:var(--text-muted); margin-top:5px;">Total: ${totalChapterOtomatis} Chapter</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        let currentComicId = null;
        let currentChaptersData = [];

        function setComicDatabase(id) {
            currentComicId = id;
            if (id === "one-punch-man") { currentChaptersData = chapters_opm; } 
            else if (id === "solo-leveling") { currentChaptersData = chapters_sololeveling; } 
            else if (id === "eleceed") { currentChaptersData = chapters_eleceed; }
            else { currentChaptersData = []; }
        }

        function openDetail(id) {
            setComicDatabase(id);
            const comic = comics.find(c => c.id === id);
            
            document.getElementById('detailTitle').innerText = comic.title;
            document.getElementById('detailDesc').innerText = comic.desc;
            
            const epListArea = document.getElementById('episodeListArea');
            const sortedChapters = [...currentChaptersData].sort((a, b) => b.chNum - a.chNum);
            
            epListArea.innerHTML = sortedChapters.map(ch => `
                <div class="episode-item" onclick="aksiDenganIklan(() => loadChapter(${ch.chNum}))">
                    ${ch.title}
                </div>
            `).join('');

            history.pushState({ page: 'detailPage', comicId: id }, "");
            renderPageLayout();
        }

        function loadChapter(chNum) {
            renderChapterImages(chNum);
            history.pushState({ page: 'readerPage', chNum: chNum, comicId: currentComicId }, "");
            renderPageLayout();
        }

        function renderChapterImages(chNum) {
            const chapter = currentChaptersData.find(ch => ch.chNum === chNum);
            if (!chapter) return;

            const viewer = document.getElementById('comicViewerArea');
            viewer.innerHTML = ""; 
            
            setTimeout(() => {
                viewer.innerHTML = chapter.images.map(imgUrl => `
                    <img src="${imgUrl}" class="comic-page-img" alt="Manga Page">
                `).join('');
            }, 50);

            const hasPrev = currentChaptersData.some(ch => ch.chNum === chNum - 1);
            const hasNext = currentChaptersData.some(ch => ch.chNum === chNum + 1);

            let prevBtnHtml = hasPrev ? `<button class="btn-nav btn-prev" onclick="aksiDenganIklan(() => loadChapter(${chNum - 1}))">← Prev Chapter ${chNum - 1}</button>` : `<div style="flex:1;"></div>`;
            let nextBtnHtml = hasNext ? `<button class="btn-nav btn-next" onclick="aksiDenganIklan(() => loadChapter(${chNum + 1}))">Next Chapter ${chNum + 1} →</button>` : `<div style="flex:1;"></div>`;

            document.getElementById('topNavArea').innerHTML = prevBtnHtml + nextBtnHtml;
            document.getElementById('bottomNavArea').innerHTML = prevBtnHtml + nextBtnHtml;
        }

        function renderPageLayout() {
            const state = history.state;
            
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('detailPage').style.display = 'none';
            document.getElementById('readerPage').style.display = 'none';

            if (!state) {
                document.getElementById('mainMenu').style.display = 'block';
                document.getElementById('comicViewerArea').innerHTML = "";
            } else if (state.page === 'detailPage') {
                document.getElementById('detailPage').style.display = 'block';
                document.getElementById('comicViewerArea').innerHTML = "";
            } else if (state.page === 'readerPage') {
                document.getElementById('readerPage').style.display = 'block';
            }
            window.scrollTo(0,0);
        }

        window.onpopstate = function(event) {
            const state = history.state;
            if (state) {
                if (state.comicId) {
                    setComicDatabase(state.comicId);
                }
                if (state.page === 'readerPage' && state.chNum) {
                    renderChapterImages(state.chNum);
                }
                if (state.page === 'detailPage' && state.comicId) {
                    const comic = comics.find(c => c.id === state.comicId);
                    document.getElementById('detailTitle').innerText = comic.title;
                    document.getElementById('detailDesc').innerText = comic.desc;
                    const epListArea = document.getElementById('episodeListArea');
                    const sortedChapters = [...currentChaptersData].sort((a, b) => b.chNum - a.chNum);
                    epListArea.innerHTML = sortedChapters.map(ch => `
                        <div class="episode-item" onclick="aksiDenganIklan(() => loadChapter(${ch.chNum}))">
                            ${ch.title}
                        </div>
                    `).join('');
                }
            }
            renderPageLayout();
        };

        function goHome() {
            history.pushState(null, "");
            renderPageLayout();
        }

        function searchComic() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            displayComics(comics.filter(c => c.title.toLowerCase().includes(q)));
        }

        window.onload = function() {
            history.replaceState(null, "");
            displayComics(comics);
        };
    </script>

    <script src="https://pl29491050.effectivecpmnetwork.com/54/1e/72/541e727447ceacba8ba2f42a3e336dc0.js"></script>

</body>
</html>
